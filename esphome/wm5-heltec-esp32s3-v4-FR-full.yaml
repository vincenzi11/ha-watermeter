substitutions:
  hostname: wm5-heltec-esp32s3-v4
  friendly_name: "Compteur d'eau"
  dashbordtitle: wm5-heltec-esp32s3-v4
  device_description: "Compteur d'eau IZAR WMBUS 2025 Heltec Wifi Lora 32 V2"
  projectname: "Peter Siebler.Izar HELTEC Watermeter"
  device_area: "Chaufferie"
  appversion: "1.0.0"
  watermeter_installed: "2024-03-01 14:00:00"
  hakey: "inH49O9jBeK5yTGb1X2g4WV/1aS6YKUpu3Vu277fDgw="
  update_interval: 10s
  impulsfactor: "0.100"
  esphome_min: "2026.6.4"

esphome:
  name: ${hostname}
  friendly_name: ${dashbordtitle}
  comment: ${device_description}
  build_path: ./build/${hostname}
  project:
    name: ${projectname}
    version: ${appversion}
  area: ${device_area}
  min_version: ${esphome_min}
  name_add_mac_suffix: false

  on_boot:
    priority: 1000
    then:
      - lambda: |-
          gpio_config_t io_conf35 = {};
          io_conf35.intr_type = GPIO_INTR_DISABLE;
          io_conf35.mode = GPIO_MODE_OUTPUT;
          io_conf35.pin_bit_mask = (1ULL << 35);
          gpio_config(&io_conf35);
          gpio_set_level(GPIO_NUM_35, 0);

          gpio_config_t io_conf36 = {};
          io_conf36.intr_type = GPIO_INTR_DISABLE;
          io_conf36.mode = GPIO_MODE_OUTPUT;
          io_conf36.pin_bit_mask = (1ULL << 36);
          gpio_config(&io_conf36);
          gpio_set_level(GPIO_NUM_36, 0);

          esp_rom_delay_us(200000);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_common, wmbus_radio, wmbus_meter]

globals:
  - id: boot_counter
    type: int
    restore_value: true
    initial_value: "0"

  # Dernière valeur du compteur IZAR en m³
  - id: last_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Consommation depuis la dernière trame, en litres
  - id: current_value
    type: float
    restore_value: false
    initial_value: "0.00"

  # Consommation de l'heure en cours, en litres
  - id: hour_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Consommation du jour en cours, en litres
  - id: daily_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Consommation d'hier, en litres
  - id: yesterday_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Consommation de la semaine en cours, en litres
  - id: week_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Consommation du mois précédent, en litres
  - id: lastmonth_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Consommation de l'année en cours, en litres
  - id: year_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Historique mensuel
  - id: january_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: february_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: march_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: april_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: may_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: june_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: july_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: august_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: september_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: october_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: november_value
    type: float
    restore_value: true
    initial_value: "0.00"
  - id: december_value
    type: float
    restore_value: true
    initial_value: "0.00"

  # Repères de période pour éviter plusieurs remises à zéro
  - id: last_hour
    type: int
    restore_value: true
    initial_value: "-1"
  - id: last_day
    type: int
    restore_value: true
    initial_value: "-1"
  - id: last_week
    type: int
    restore_value: true
    initial_value: "-1"
  - id: last_month
    type: int
    restore_value: true
    initial_value: "-1"
  - id: last_year
    type: int
    restore_value: true
    initial_value: "-1"

  - id: send_millisecond
    type: int
    restore_value: false
    initial_value: "0"

logger:
  level: DEBUG
  logs:
    wmbusmeters: INFO
    wmbus: INFO
    cc1101: INFO

wifi:
  domain: .local
  reboot_timeout: 0s
  enable_on_boot: true
  power_save_mode: NONE
  ap:
    ssid: Point d'accès ${friendly_name}
    password: !secret ssid1_pswd
  ssid: !secret ssid1_name
  password: !secret ssid1_pswd

captive_portal:

mdns:
  disabled: false

api:
  id: espapi_wmbus_heltec_v4
  port: 6053
  reboot_timeout: 0s
  encryption:
    key: ${hakey}
  actions:
    - action: set_watermeter_esp_data
      variables:
        water_val_hour: float
        water_val_day: float
      then:
        - logger.log:
            tag: "service"
            format: "Tentative de définition des nouvelles valeurs : heure : %.3f, jour : %.3f"
            level: INFO
            args:
              - water_val_hour
              - water_val_day
        - globals.set:
            id: hour_value
            value: !lambda |-
              if (water_val_hour > 0.001f) {
                return water_val_hour;
              }
              return id(hour_value);
        - sensor.template.publish:
            id: waterhour
            state: !lambda "return id(hour_value);"
        - globals.set:
            id: daily_value
            value: !lambda |-
              if (water_val_day > 0.001f) {
                return water_val_day;
              }
              return id(daily_value);
        - sensor.template.publish:
            id: waterday
            state: !lambda "return id(daily_value);"

web_server:
  port: 80
  version: 3
  local: true

ota:
  platform: esphome
  password: !secret ota_pswd

time:
  - platform: sntp
    id: time_sntp
    timezone: Europe/Paris
    servers:
      - 0.fr.pool.ntp.org
      - 1.fr.pool.ntp.org
      - 2.fr.pool.ntp.org

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14
  on_frame:
    - then:
        - logger.log:
            format: "Trame reçue : RSSI=%ddBm, Mode=%s, Données=%s"
            args: [ 'frame->rssi()', 'toString(frame->link_mode())', 'frame->as_hex().c_str()' ]

wmbus_meter:
  - id: wa_meter
    meter_id: 0x30405282
    type: dme_07
    mode:
      - T1
      - C1

i2c:
  - id: bus_a
    sda: GPIO17
    scl: GPIO18
    frequency: 100khz
    scan: true

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 10
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!_#@*+-=/()[]{}°³äöüÄÖÜß "

display:
  - platform: ssd1306_i2c
    model: "ssd1306 128x64"
    id: screen
    i2c_id: bus_a
    address: 0x3c
    reset_pin: GPIO21
    lambda: |-
      int y = 2;
      int abstand = 13;
      int x_wert = 128;
      it.print(0, y, id(font1), "Passerelle active");

      if (id(wlan_ssid).has_state() && id(wlan_ssid).state != "Unknown") {
        it.printf(x_wert, y, id(font1), TextAlign::TOP_RIGHT, "%s", id(wlan_ssid).state.c_str());
      } else {
        it.print(x_wert, y, id(font1), TextAlign::TOP_RIGHT, "Hors ligne");
      }

      if (id(waterdisplay).has_state()) {
        y += abstand;
        it.print(0, y, id(font1), "Eau");
        it.printf(x_wert, y, id(font1), TextAlign::TOP_RIGHT, "%.3f m³", id(waterdisplay).state);
      }

button:
  - platform: restart
    name: Redémarrer l'ESP
    id: restart_device
    disabled_by_default: false
    entity_category: config
    icon: mdi:restart
    device_class: restart

  - platform: template
    name: "Réinitialiser les valeurs du compteur d'eau"
    icon: mdi:lock-reset
    entity_category: config
    on_press:
      then:
        - lambda: |-
            id(last_value) = 0.0f;
            id(current_value) = 0.0f;
            id(hour_value) = 0.0f;
            id(daily_value) = 0.0f;
            id(yesterday_value) = 0.0f;
            id(week_value) = 0.0f;
            id(lastmonth_value) = 0.0f;
            id(year_value) = 0.0f;

            id(january_value) = 0.0f;
            id(february_value) = 0.0f;
            id(march_value) = 0.0f;
            id(april_value) = 0.0f;
            id(may_value) = 0.0f;
            id(june_value) = 0.0f;
            id(july_value) = 0.0f;
            id(august_value) = 0.0f;
            id(september_value) = 0.0f;
            id(october_value) = 0.0f;
            id(november_value) = 0.0f;
            id(december_value) = 0.0f;

            id(last_hour) = -1;
            id(last_day) = -1;
            id(last_week) = -1;
            id(last_month) = -1;
            id(last_year) = -1;

            id(watercurrent).publish_state(0.0f);
            id(waterhour).publish_state(0.0f);
            id(waterday).publish_state(0.0f);
        - logger.log:
            level: INFO
            tag: "service"
            format: "Toutes les valeurs du compteur d'eau ont été réinitialisées !"

sensor:
  - platform: wmbus_meter
    parent_id: wa_meter
    field: total_m3
    id: waterdisplay
    name: Affichage Eau
    unit_of_measurement: "m³"
    state_class: total_increasing
    device_class: water
    accuracy_decimals: 3
    icon: mdi:counter

    on_value:
      then:
        - lambda: |-
            auto now = id(time_sntp).now();

            if (!now.is_valid()) {
              ESP_LOGW("water", "Heure NTP non valide, calcul des périodes reporté.");
              return;
            }

            int hour = now.hour;
            int day = now.day_of_year;
            
            char week_buf[4];
            now.strftime(week_buf, sizeof(week_buf), "%V");
            int week = atoi(week_buf);
            
            int month = now.month;
            int year = now.year;

            // Initialisation des repères au premier passage.
            if (id(last_hour) < 0) id(last_hour) = hour;
            if (id(last_day) < 0) id(last_day) = day;
            if (id(last_week) < 0) id(last_week) = week;
            if (id(last_month) < 0) id(last_month) = month;
            if (id(last_year) < 0) id(last_year) = year;

            // Changement d'heure.
            if (hour != id(last_hour)) {
              id(hour_value) = 0.0f;
              id(last_hour) = hour;
              id(waterhour).publish_state(0.0f);
            }

            // Changement de jour.
            if (day != id(last_day)) {
              id(yesterday_value) = id(daily_value);
              id(daily_value) = 0.0f;
              id(last_day) = day;
              id(waterday).publish_state(0.0f);
            }

            // Changement de semaine.
            if (week != id(last_week)) {
              id(week_value) = 0.0f;
              id(last_week) = week;
            }

            // Changement d'année : on remet l'année à zéro.
            if (year != id(last_year)) {
              id(year_value) = 0.0f;
              id(last_year) = year;
            }

            // Changement de mois.
            if (month != id(last_month)) {
              id(lastmonth_value) = id(daily_value);
              id(last_month) = month;
            }

            float meter_value = id(waterdisplay).state;

            // Première lecture après démarrage.
            if (id(last_value) <= 0.0f) {
              id(last_value) = meter_value;
              id(current_value) = 0.0f;
              id(watercurrent).publish_state(0.0f);
              return;
            }

            // Nouvelle consommation.
            if (meter_value > id(last_value)) {
              float consumption = (meter_value - id(last_value)) * 1000.0f;

              // Protection contre une trame aberrante.
              if (consumption >= 0.0f && consumption < 10000.0f) {
                id(current_value) = consumption;

                id(hour_value) += consumption;
                id(daily_value) += consumption;
                id(week_value) += consumption;
                id(year_value) += consumption;

                switch (month) {
                  case 1:  id(january_value) += consumption; break;
                  case 2:  id(february_value) += consumption; break;
                  case 3:  id(march_value) += consumption; break;
                  case 4:  id(april_value) += consumption; break;
                  case 5:  id(may_value) += consumption; break;
                  case 6:  id(june_value) += consumption; break;
                  case 7:  id(july_value) += consumption; break;
                  case 8:  id(august_value) += consumption; break;
                  case 9:  id(september_value) += consumption; break;
                  case 10: id(october_value) += consumption; break;
                  case 11: id(november_value) += consumption; break;
                  case 12: id(december_value) += consumption; break;
                }

                id(watercurrent).publish_state(id(current_value));
                id(waterhour).publish_state(id(hour_value));
                id(waterday).publish_state(id(daily_value));
              } else {
                id(current_value) = 0.0f;
                id(watercurrent).publish_state(0.0f);
                ESP_LOGW("water", "Consommation ignorée : %.2f L", consumption);
              }
            } else {
              id(current_value) = 0.0f;
              id(watercurrent).publish_state(0.0f);
            }

            id(last_value) = meter_value;

        - text_sensor.template.publish:
            id: watermeter_lastupdate
            state: !lambda |-
              return id(time_sntp).now().strftime("%Y-%m-%dT%H:%M:%S %Z");

        - sensor.template.publish:
            id: watermeter_read_timeout
            state: !lambda |-
              int time_used = millis() - id(send_millisecond);
              id(send_millisecond) = millis();
              return float(time_used) / 1000.0f;

  - platform: wmbus_meter
    parent_id: wa_meter
    field: last_month_total_m3
    id: waterdisplaylastmonth
    name: Eau Mois précédent (compteur)
